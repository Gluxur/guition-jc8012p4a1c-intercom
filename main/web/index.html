<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visiophone — carte SD</title>
<style>
:root{color-scheme:dark}
body{margin:0;font:16px system-ui,sans-serif;background:#12151c;color:#c8ceda}
header{padding:12px 16px;background:#1b1f2a;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600}
#crumb{color:#8f98aa;word-break:break-all}
main{padding:12px 16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #262b38}
th{color:#8f98aa;font-weight:500;font-size:14px}
td.size{text-align:right;white-space:nowrap;color:#8f98aa}
a{color:#6aa9ff;text-decoration:none}
button{background:#2a3040;color:#c8ceda;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:#39415a}
#drop{margin:16px 0;padding:24px;border:2px dashed #39415a;border-radius:10px;text-align:center;color:#8f98aa}
#drop.over{border-color:#6aa9ff;color:#6aa9ff}
progress{width:100%;height:8px}
footer{padding:12px 16px;color:#8f98aa;font-size:14px}
#err{background:#4a1f24;color:#ffb3b8;padding:10px 16px;display:none}
</style>
</head>
<body>
<header><h1>Carte SD</h1><span id="crumb"></span></header>
<div id="err"></div>
<main>
<table><thead><tr><th>Nom</th><th class="size">Taille</th><th></th></tr></thead>
<tbody id="rows"></tbody></table>
<div id="drop">Déposer un fichier ici, ou <button id="pick">choisir…</button>
<input id="file" type="file" hidden>
<progress id="prog" value="0" max="100" hidden></progress></div>
</main>
<footer id="info"></footer>
<script>
const ROOT="/sdcard";let dir=ROOT;
const $=i=>document.getElementById(i);
const human=n=>n<1024?n+" o":n<1048576?(n/1024).toFixed(1)+" Ko":(n/1048576).toFixed(1)+" Mo";
function err(m){$("err").textContent=m;$("err").style.display=m?"block":"none"}
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(await r.text()||r.status);return r.json()}
async function load(){
  err("");
  try{
    const d=await jget("/api/ls?dir="+encodeURIComponent(dir));
    $("crumb").textContent=dir;
    const tb=$("rows");tb.textContent="";
    if(dir!==ROOT){
      const tr=tb.insertRow();tr.insertCell().innerHTML='<a href="#" id="up">..</a>';
      tr.insertCell();tr.insertCell();
      $("up").onclick=e=>{e.preventDefault();dir=dir.replace(/\/[^/]*$/,"")||ROOT;load()};
    }
    for(const f of d.files){
      const tr=tb.insertRow();const p=dir.replace(/\/$/,"")+"/"+f.name;
      const c0=tr.insertCell();
      if(f.dir){const a=document.createElement("a");a.href="#";a.textContent=f.name+"/";
        a.onclick=e=>{e.preventDefault();dir=p;load()};c0.appendChild(a);}
      else{const a=document.createElement("a");a.href="/api/dl?path="+encodeURIComponent(p);
        a.textContent=f.name;c0.appendChild(a);}
      const c1=tr.insertCell();c1.className="size";c1.textContent=f.dir?"":human(f.size);
      const c2=tr.insertCell();
      if(!f.dir){const b=document.createElement("button");b.textContent="Supprimer";
        b.onclick=()=>del(p,f.name);c2.appendChild(b);}
      if(!f.dir&&/\.bin$/i.test(f.name)){
        const b2=document.createElement("button");b2.textContent="Flasher";
        b2.style.marginLeft="6px";
        b2.onclick=async()=>{
          if(!confirm("Flasher "+f.name+" ? L'appareil redemarrera."))return;
          const r=await fetch("/api/ota?path="+encodeURIComponent(p),{method:"POST"});
          if(!r.ok){err("Refus : "+await r.text());return}
          err("Mise a jour lancee. L'appareil redemarre dans une minute.");
        };
        c2.appendChild(b2);
      }
    }
    const i=await jget("/api/info");
    $("info").textContent=i.ok?human(i.free)+" libres sur "+human(i.total)
                              :"capacite indisponible";
  }catch(e){err("Erreur : "+e.message)}
}
async function del(p,name){
  if(!confirm("Supprimer "+name+" ?"))return;
  const r=await fetch("/api/rm?path="+encodeURIComponent(p),{method:"POST"});
  if(!r.ok){err("Suppression refusée : "+await r.text());return}
  load();
}
function upload(f){
  const p=dir.replace(/\/$/,"")+"/"+f.name;
  const x=new XMLHttpRequest();
  x.open("POST","/api/up?path="+encodeURIComponent(p));
  $("prog").hidden=false;$("prog").value=0;
  x.upload.onprogress=e=>{if(e.lengthComputable)$("prog").value=e.loaded*100/e.total};
  x.onload=()=>{$("prog").hidden=true;
    if(x.status>=200&&x.status<300){load()}else{err("Envoi refusé : "+x.responseText)}};
  x.onerror=()=>{$("prog").hidden=true;err("Envoi interrompu")};
  x.send(f);
}
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{if(e.target.files[0])upload(e.target.files[0])};
const d=$("drop");
d.ondragover=e=>{e.preventDefault();d.classList.add("over")};
d.ondragleave=()=>d.classList.remove("over");
d.ondrop=e=>{e.preventDefault();d.classList.remove("over");
  if(e.dataTransfer.files[0])upload(e.dataTransfer.files[0])};
load();
</script>
</body>
</html>
