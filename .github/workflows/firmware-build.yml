name: Firmware build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        env:
          # esp_hosted's Kconfig reads $(ESP_IDF_VERSION); empty, kconfgen fails
          # with "Missing required kconfig option".
          ESP_IDF_VERSION: "6.0"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py build
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/esp32_p4_webrtc_cam.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
      - name: Show build logs on failure
        if: failure()
        shell: bash
        run: tail -n 80 build/log/idf_py_std*_output_* || true
