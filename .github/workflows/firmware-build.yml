name: Firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Digest pin: a re-pushed tag would otherwise change the toolchain silently.
    container: espressif/idf:v6.0.1@sha256:efc19fae2f52fc6873630c668da26aa834139a063b5fb73a46ebc0dbd217b587
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build firmware
        shell: bash
        env:
          # esp_hosted's Kconfig reads $(ESP_IDF_VERSION); empty, kconfgen fails
          # with "Missing required kconfig option".
          ESP_IDF_VERSION: "6.0"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          # Same tool versions as the reference Windows install (a newer
          # component manager re-evaluates esp_hosted's optional USB
          # dependencies and stops on unknown Kconfig options).
          python -m pip show idf-component-manager esp-idf-kconfig | grep -E '^(Name|Version)'
          python -m pip install -q "idf-component-manager==3.0.3" "esp-idf-kconfig==3.11.1"
          idf.py build
      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            build/esp32_p4_webrtc_cam.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
      - name: Show build logs on failure
        if: failure()
        shell: bash
        run: |
          tail -n 80 build/log/idf_py_std*_output_* || true
          git status --short
          git diff --stat
          for f in managed_components/*/idf_component.yml; do echo "$f: $(grep -m1 '^version' "$f")"; done
          grep -rln 'HOST_USB_CDC_ACM_MANIFEST' managed_components || true
