name: Host unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Configure
        run: cmake -S test -B test/build -G Ninja
      - name: Build
        run: cmake --build test/build
      - name: Test
        run: ctest --test-dir test/build --output-on-failure
      - name: Home Assistant response templates
        run: |
          sudo apt-get install -y --no-install-recommends python3-jinja2
          python3 test/ha_templates/check_templates.py .
